name: Package
description: >-
  Builds awoo and produces the two artifacts people download -- the portable
  zip and the Inno Setup installer -- into artifacts/dist. The one packaging
  recipe, used by the per-push build and by the release workflow alike, so a
  release is built exactly the way every push has already verified.

inputs:
  version:
    description: 'The version to stamp, prerelease suffix included (e.g. 1.2.0-rc.1).'
    required: true
  numeric:
    description: 'The version as digits only (e.g. 1.2.0), for Win32 version resources.'
    required: true
  inno-setup-version:
    description: 'The Tools.InnoSetup NuGet package to compile the installer with.'
    required: false
    default: '6.7.3'

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build
      shell: pwsh
      run: dotnet build src/Awoo/Awoo.csproj -c Release -p:Version=${{ inputs.version }}

    # Self-contained, so the portable build and the installer both run on a
    # machine with no .NET runtime and no Windows App Runtime of their own.
    - name: Publish the portable build
      shell: pwsh
      run: >
        dotnet publish src/Awoo/Awoo.csproj -c Release
        -p:SelfContained=true
        -p:Version=${{ inputs.version }}
        -p:PublishDir=${{ github.workspace }}/artifacts/portable/

    - name: Zip the portable build
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path artifacts/dist | Out-Null
        $zip = "artifacts/dist/awoo-${{ inputs.version }}-portable-win-x64.zip"
        Compress-Archive -Path artifacts/portable/* -DestinationPath $zip -CompressionLevel Optimal
        "{0} -- {1:N1} MB" -f $zip, ((Get-Item $zip).Length / 1MB)

    # Inno Setup ships its command-line compiler as a NuGet package, which
    # pins the version rather than taking whatever the runner image happens
    # to carry -- and needs no installer and no admin rights.
    - name: Fetch Inno Setup
      shell: pwsh
      run: |
        $v = '${{ inputs.inno-setup-version }}'
        $url = "https://api.nuget.org/v3-flatcontainer/tools.innosetup/$v/tools.innosetup.$v.nupkg"
        Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP/innosetup.zip" -UseBasicParsing
        Expand-Archive -Path "$env:RUNNER_TEMP/innosetup.zip" -DestinationPath "$env:RUNNER_TEMP/innosetup"
        $iscc = "$env:RUNNER_TEMP/innosetup/tools/ISCC.exe"
        if (-not (Test-Path $iscc)) { throw "No ISCC.exe in Tools.InnoSetup $v." }
        "ISCC=$iscc" | Out-File $env:GITHUB_ENV -Append

    - name: Compile the installer
      shell: pwsh
      run: |
        & $env:ISCC packaging/awoo.iss `
          "/DAppVersion=${{ inputs.version }}" `
          "/DAppVersionNumeric=${{ inputs.numeric }}" `
          "/DPayloadDir=${{ github.workspace }}\artifacts\portable" `
          "/DOutputDir=${{ github.workspace }}\artifacts\dist"
        if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE." }

    - name: Check both artifacts are there
      shell: pwsh
      run: |
        $expected = @(
          "artifacts/dist/awoo-${{ inputs.version }}-portable-win-x64.zip",
          "artifacts/dist/awoo-${{ inputs.version }}-setup.exe"
        )
        $missing = $expected | Where-Object { -not (Test-Path $_) }
        if ($missing) { throw "Not produced: $($missing -join ', ')" }
        Get-ChildItem artifacts/dist | ForEach-Object { "{0,8:N1} MB  {1}" -f ($_.Length/1MB), $_.Name }
