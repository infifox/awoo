name: Build

# awoo is a Windows 11 app, so everything here runs on Windows. Every push and
# pull request builds it and produces the two artifacts people actually
# download -- through the same .github/actions/package recipe the release
# workflow uses, which is what keeps the release path from being first
# exercised on the day of a release. Publishing a release is release.yml's job.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $xml = [xml](Get-Content src/Awoo/Awoo.csproj)
          $version = ($xml.Project.PropertyGroup.Version | Where-Object { $_ }) -as [string]
          if (-not $version) { throw 'Could not work out a version.' }

          # Win32 version resources and Inno's VersionInfoVersion take digits
          # only, so a prerelease tag keeps its suffix in names and loses it here.
          $numeric = ($version -split '-')[0]

          "version=$version"  | Out-File $env:GITHUB_OUTPUT -Append
          "numeric=$numeric"  | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Version $version (file version $numeric)"

      - name: Build and package
        uses: ./.github/actions/package
        with:
          version: ${{ steps.version.outputs.version }}
          numeric: ${{ steps.version.outputs.numeric }}

      - uses: actions/upload-artifact@v4
        with:
          name: awoo-${{ steps.version.outputs.version }}
          path: artifacts/dist/*
          if-no-files-found: error
